name: Bug report
description: Something isn't working — install failures, crashes, wrong output, silent no-ops.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The version and install method in
        particular let us reproduce install/runtime issues quickly.

        For **security vulnerabilities**, do **not** open a public issue — use
        [private vulnerability reporting](https://github.com/mohankrishnaalavala/context-router/security/advisories/new)
        instead (see `SECURITY.md`).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
      placeholder: "Running `uv tool install context-router-cli` fails with ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: context-router version
      description: Output of `context-router --version`. If install failed, write "install failed".
      placeholder: "context-router 4.4.5"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - uv tool install
        - pipx
        - pip
        - Homebrew (brew)
        - From source (git clone)
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      description: e.g. output of `python3 --version` plus your OS.
      placeholder: "macOS 14.6 / Python 3.12.4"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, exact commands so we can reproduce on a clean machine.
      placeholder: |
        1. `uv tool install context-router-cli`
        2. `context-router index --project-root .`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stderr output
      description: Paste any error output. Most commands warn to stderr with a named reason — include it.
      render: shell
    validations:
      required: false
