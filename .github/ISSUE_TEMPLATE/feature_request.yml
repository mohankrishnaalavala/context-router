name: Feature request
description: Suggest an idea, new mode, language analyzer, or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. context-router aims for a **minimal shipped surface** —
        the clearer the user-visible outcome you want, the easier it is to evaluate.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation where context-router falls short today.
      placeholder: "When I run a handover pack on a Kotlin repo, no symbols are extracted because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like context-router to do? Include the CLI/MCP surface if you have one in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried or other approaches you weighed.
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: How would you verify it works?
      description: A user-visible result or measurable outcome (maps to our outcome-based DoD).
    validations:
      required: false
