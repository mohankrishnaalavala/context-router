# docs/release/v4-outcomes.yaml — v4.0 feature outcome registry.
outcomes:
  - id: v4.0-evaluation-harness
    phase: v4.0
    priority: P0
    dod:
      outcome: >-
        `context-router eval --help` prints the subcommand help and
        `context-router eval --queries <path> --json` emits a JSON report.
      threshold: >-
        Report JSON has keys recall_at_k, k, n_queries, mean_pack_tokens,
        token_efficiency, per_query.
      negative_case: >-
        `context-router eval --queries /nonexistent.jsonl` exits non-zero with
        a stderr message naming the missing file.
      verify:
        cmd: context-router eval --help
        expected_stdout_contains: "Recall@K"

  - id: v4.0-workspace-db-sync
    phase: v4.0
    priority: P0
    dod:
      outcome: >-
        `context-router workspace sync` writes cross-repo edges into
        .context-router/workspace.db scoped per src_repo.
      threshold: >-
        Running `workspace sync` on the synthetic fixture completes without
        error and prints a TOTAL line to stdout.
      negative_case: >-
        Running `workspace sync` without a workspace.yaml prints a warning to
        stderr (via _load_or_die) and exits non-zero.
      verify:
        cmd: >-
          context-router workspace sync
            --project-root tests/fixtures/workspaces/synthetic
        expected_stdout_contains: "TOTAL:"

  - id: v4.0-synthetic-recall-gate
    phase: v4.0
    priority: P0
    dod:
      outcome: >-
        CI runs scripts/eval-synthetic.sh on every PR and fails if
        Recall@20 < 0.65 on the synthetic fixture.
      threshold: >-
        scripts/eval-synthetic.sh exits 0 with "PASS synthetic-recall-gate"
        on the current codebase.
      negative_case: >-
        If the fixture is missing, the script exits non-zero with
        "FAIL synthetic-recall-gate: fixture not found".
      verify:
        cmd: bash scripts/eval-synthetic.sh
        expected_stdout_contains: "PASS synthetic-recall-gate"

  - id: v4.0-workspace-orchestrator
    phase: v4.0
    priority: P0
    dod:
      outcome: >-
        `WorkspaceOrchestrator(workspace_root=path).cross_repo_edges_for_repo(repo_id)`
        reads edges from workspace.db without recomputing them.
      threshold: >-
        TestWorkspaceDbBackedBoost.test_reads_edges_from_workspace_db passes.
      negative_case: >-
        When workspace.db does not exist, `cross_repo_edges_for_repo` returns
        an empty list (no error).
      verify:
        cmd: >-
          uv run pytest packages/core/tests/test_workspace_orchestrator.py::TestWorkspaceDbBackedBoost
        expected_stdout_contains: "passed"

  - id: v4.1-save-observation-file
    phase: v4.1
    priority: P0
    description: >-
      save_observation writes a git-tracked .md file under
      .context-router/memory/observations/ with YAML frontmatter.
    dod:
      outcome: >-
        After save_observation, a .md file exists whose frontmatter
        lists files_touched. Write gate rejects obs with no files_touched.
      threshold: >-
        .context-router/memory/observations/*.md exists after a valid
        save_observation call.
      negative_case: >-
        save_observation with no files_touched does not write a .md file.
      verify:
        cmd: bash scripts/smoke-v4.1.sh
        expected_stdout_contains: "PASS: 4/4"

  - id: v4.1-pack-use-memory
    phase: v4.1
    priority: P0
    description: >-
      pack --use-memory includes top-8 ranked observations in JSON output.
    dod:
      outcome: >-
        pack --use-memory --json output contains memory_hits key with
        at least 0 items (no crash when memory is empty).
      threshold: >-
        "memory_hits": appears in pack --use-memory --json output.
      negative_case: >-
        pack without --use-memory does not include memory_hits key.
      verify:
        cmd: bash scripts/smoke-v4.1.sh
        expected_stdout_contains: "PASS: 4/4"

  - id: v4.1-migrate-sqlite
    phase: v4.1
    priority: P1
    description: >-
      memory migrate-from-sqlite writes one .md file per valid SQLite row.
    dod:
      outcome: >-
        migrate-from-sqlite reads all SQLite observations and writes .md
        files for those passing the write gate.
      threshold: >-
        Exit code 0 and JSON output includes migrated count.
      negative_case: >-
        Short-summary observations are skipped (write gate enforced).
      verify:
        cmd: bash scripts/smoke-v4.1.sh
        expected_stdout_contains: "PASS: 4/4"

  - id: v4.2-memory-promotion
    phase: v4.2
    priority: P0
    description: >-
      Committed memory files surface in teammate packs; staged/branch-local
      observations are visible only on the authoring branch.
    dod:
      outcome: >-
        On a clean checkout of main, pack --use-memory only surfaces
        observations committed to main. Staged-only observations written on
        a feature branch do not appear in a main-branch pack.
      threshold: >-
        (a) After git commit of an observation file, pack --use-memory on
        main includes at least that one hit. (b) A staged-but-uncommitted
        observation does not appear in pack output built from a fresh main
        checkout. (c) memory_hits_summary key present in --json output with
        committed and staged integer values.
      negative_case: >-
        If git is unavailable or the observations directory is not inside a
        git repo, all hits are treated as committed (no crash, no empty pack).
      verify:
        cmd: >-
          context-router pack --use-memory --json --query "…"
          | jq '.memory_hits_summary'
        expected_stdout_contains: "committed"

  - id: v4.2-memory-sub-budget
    phase: v4.2
    priority: P0
    description: >-
      Memory token consumption is capped at 15% of the total pack budget.
      Configurable via memory_budget_pct in .context-router/config.yaml.
    dod:
      outcome: >-
        Memory items in a pack never exceed int(total_budget * 0.15) tokens.
        Code items fill the remaining 85%.
      threshold: >-
        pack_tokens_memory / pack_tokens_total <= 0.15 on every
        release-fixture query. budget.memory_ratio in --json output is a
        float in [0.0, 0.15].
      negative_case: >-
        If memory_budget_pct is set <= 0 or >= 1 in config.yaml,
        context-router emits "warning: memory_budget_pct out of range,
        using 0.15" to stderr and falls back to the default.
      verify:
        cmd: >-
          context-router pack --use-memory --json --query "…"
          | jq '.budget.memory_ratio'
        expected_stdout_contains: "0."

  - id: v4.2-adaptive-top-k
    phase: v4.2
    priority: P1
    description: >-
      Trailing items whose confidence is below 60% of the leader's confidence
      are dropped in review and implement modes. Debug and handover modes
      return all items for completeness.
    dod:
      outcome: >-
        In review/implement modes, the returned item list never includes
        trailing items with confidence < 0.6 * items[0].confidence.
        In debug/handover modes, all budget-admitted items are returned
        regardless of relative confidence.
      threshold: >-
        On the judge benchmark single-file ground-truth fixture, F1 >= 0.45
        in review mode (up from 0.270 baseline). The synthetic Recall@20 gate
        (scripts/eval-synthetic.sh) continues to pass.
      negative_case: >-
        When all items have similar confidence (max spread < 40%), no items
        are dropped (floor never fires). When only one item remains, it is
        always returned regardless of confidence.
      verify:
        cmd: >-
          uv run pytest packages/ranking/tests/test_ranker.py
          -k "adaptive_topk" -v
        expected_stdout_contains: "passed"

  # ---------------------------------------------------------------------------
  # v4.3 outcomes
  # ---------------------------------------------------------------------------

  - id: v4.3-adaptive-topk-gradient
    phase: v4.3
    priority: P0
    description: >-
      Plateau-based second cut in adaptive top-k. When consecutive items have
      confidence within PLATEAU_DELTA (0.02) of each other AND all are below
      ABS_FLOOR (0.45), trailing plateau items are dropped.
    dod:
      outcome: >-
        Adaptive top-k fires on tight-cluster tasks that Rule 1 (0.6× floor)
        previously missed. On the 12-task benchmark, adaptive top-k fires on
        >= 6 tasks (up from 3). Avg F1 >= 0.450. Avg tokens <= 2,100.
      threshold: >-
        test_adaptive_topk_plateau_rule_fires passes: items [0.52, 0.44, 0.43, 0.42, 0.41]
        with ABS_FLOOR=0.45 → only first two kept.
        test_adaptive_topk_plateau_rule_noop_above_abs_floor passes: items all >= ABS_FLOOR
        → no cut.
      negative_case: >-
        When items span a wide range (leader 0.80, trailer 0.45), Rule 1 fires
        instead of Rule 2. No double-cut. Items above ABS_FLOOR are never dropped
        by the plateau rule.
      verify:
        cmd: uv run pytest packages/ranking/tests/test_ranker.py -k "plateau" -v
        expected_stdout_contains: "passed"

  - id: v4.3-fastapi-t1-recovery
    phase: v4.3
    priority: P1
    description: >-
      Extend _AUX_PATH_RE to cover docs_src/, examples/, fixtures/, stubs/, mocks/
      paths so tutorial files receive the 0.85x auxiliary-file penalty.
    dod:
      outcome: >-
        fastapi T1 (oauth2 docstring): GT file (fastapi/security/oauth2.py) appears
        in top-5. docs_src/security/tutorial003*.py ranks below oauth2.py.
      threshold: >-
        _is_test_or_script_path('docs_src/security/tutorial003_py310.py') returns True.
        _is_test_or_script_path('examples/auth.py') returns True.
        _is_test_or_script_path('src/main.py') returns False.
      negative_case: >-
        Canonical source files (fastapi/security/oauth2.py, src/core/ranker.py) are
        NOT matched by _AUX_PATH_RE and receive no penalty.
      verify:
        cmd: uv run pytest packages/ranking/tests/test_ranker.py -k "aux_path_re" -v
        expected_stdout_contains: "passed"

  - id: v4.3-stale-detection
    phase: v4.3
    priority: P0
    description: >-
      Git-based staleness detection for memory observations. Observations whose
      files_touched paths are absent from HEAD are flagged as stale. CLI commands
      surface severity and allow pruning.
    dod:
      outcome: >-
        `memory stale` lists observations whose files_touched paths are absent from
        HEAD. Stale hits in pack output carry "stale": true and emit a stderr warning.
        `memory prune --stale` removes them and prints a count.
      threshold: >-
        On a fixture where one observation points at a deleted file:
        (a) `memory stale` lists that observation with severity missing_file.
        (b) `pack --use-memory --json` includes "stale": true on that hit.
        (c) `memory prune --stale` removes it; subsequent `memory stale` returns empty.
      negative_case: >-
        When git is unavailable, `memory stale` exits non-zero with
        "git is required for staleness detection" on stderr. Pack still builds.
      verify:
        cmd: bash scripts/smoke-v4.3.sh
        expected_stdout_contains: "PASS: stale-detection"

  - id: v4.3-memory-federation
    phase: v4.3
    priority: P0
    description: >-
      Cross-repo memory federation via workspace.yaml. search_memory --workspace
      queries memory from all workspace repos. Federated hits carry source_repo labels.
    dod:
      outcome: >-
        search_memory --workspace returns hits from all workspace repos labeled with
        source_repo. pack --use-memory --workspace injects federated hits.
        memory_hits_summary includes a "federated" count.
      threshold: >-
        On the synthetic workspace fixture with observations in both backend and
        frontend repos (committed):
        (a) search_memory --workspace --query "checkout" returns at least one hit
            from each repo.
        (b) pack --use-memory --json shows memory_hits_summary.federated > 0.
        (c) Staged-only observations from sibling repos do NOT appear in results.
      negative_case: >-
        When --workspace is passed without a workspace.yaml,
        "WARN: --workspace has no effect; no workspace.yaml found" is emitted to
        stderr and the command proceeds in single-repo mode.
      verify:
        cmd: bash scripts/smoke-v4.3.sh
        expected_stdout_contains: "PASS: memory-federation"

  # ── v4.4 outcomes ──────────────────────────────────────────────────────────

  - id: v4.4-symbol-body-enrichment
    phase: v4.4
    priority: P0
    description: >-
      ContextItems in agent format include inline symbol bodies so agents read
      ~200 tokens instead of opening full files (~10,000 tokens).
    dod:
      outcome: >-
        `context-router pack --format agent` returns items with a "body" key
        containing the actual source code for each symbol. Agents no longer
        need to read entire files to get symbol content.
      threshold: >-
        For any pack with at least one indexed symbol, to_agent_format() returns
        a "body" key on items where the symbol was found in the DB and the file
        is readable. Items without a DB match omit "body" silently.
      negative_case: >-
        When a symbol is not in the index (e.g. after a fresh clone before
        `context-router index`), the item is returned without "body" and no
        warning is emitted — agents fall back to reading the full file.
      verify:
        cmd: >-
          context-router pack --mode implement --query "oauth2 password" --format agent --json
        expected_stdout_contains: '"body"'

  - id: v4.4-source-file-boost
    phase: v4.4
    priority: P0
    description: >-
      Source files whose basename matches a query token are boosted 1.3x over
      test files that only mention the module name in excerpts.
    dod:
      outcome: >-
        For the query "Fix typo for client_secret in OAuth2 form docstrings",
        fastapi/security/oauth2.py ranks at position 1 in the pack (was missing
        from top-5 in v4.3).
      threshold: >-
        `context-router pack --mode debug --query "oauth2 form docstrings"` against
        a fastapi checkout returns oauth2.py as the first item in selected_items.
      negative_case: >-
        The boost only fires for non-test, non-script source files. Test files
        (matching _is_test_or_script_path) are never boosted, regardless of
        filename match.
      verify:
        cmd: >-
          context-router pack --mode debug --query "oauth2 form docstrings" --json
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['selected_items'][0]['path_or_ref'])"
        expected_stdout_contains: "oauth2"

  - id: crg-parity-fastapi
    phase: v4.4
    priority: P0
    description: >-
      context-router matches or beats code-review-graph F1 on the FastAPI
      parity fixture.
    dod:
      outcome: >-
        The FastAPI CR-vs-CRG harness runs all pinned fixture commits and the
        score gate exits 0 when context-router average F1 is >= 0.80 and
        context-router/code-review-graph average F1 ratio is >= 1.00.
      threshold: >-
        The harness prints "done. Artifacts" and writes summary.md plus
        diagnostics.json under /tmp/context-router-crg-parity-ship-check.
      negative_case: >-
        Missing local FastAPI clone skips in ship-check with
        "SKIP crg-parity-fastapi: local fastapi clone not found" instead of
        failing unrelated environments.
      verify:
        cmd: >-
          bash eval/fastapi-crg/run.sh --fastapi-root
          /Users/mohankrishnaalavala/Documents/project_context/fastapi
          --output-dir /tmp/context-router-crg-parity-ship-check
        expected_stdout_contains: "done. Artifacts"

  - id: v4.4-language-analyzers
    phase: v4.4
    priority: P1
    description: >-
      Six new language analyzers (Go, Rust, Ruby, PHP, SQL, JavaScript) produce
      symbols for indexing, making context-router effective on polyglot repos.
    dod:
      outcome: >-
        `context-router index` on a repo containing .go, .rs, .rb, .php, .sql,
        and .js files produces symbols for each language. Pack results for those
        repos include file-level context items.
      threshold: >-
        Each language analyzer package has ≥4 passing unit tests covering
        function/method/class/struct detection and test-file detection.
      negative_case: >-
        Files with unsupported extensions are silently skipped (no warning, no
        crash). The overall index run still succeeds.
      verify:
        cmd: >-
          uv run pytest packages/language-go packages/language-rust packages/language-ruby
            packages/language-php packages/language-sql packages/language-typescript -q
        expected_stdout_contains: "passed"

  - id: v4.4-semantic-rerank-default
    phase: v4.4
    priority: P1
    description: >-
      Semantic re-ranking (all-MiniLM-L6-v2) is enabled by default. ABS_FLOOR
      lowered from 0.45 to 0.40 to recover borderline-confidence items.
    dod:
      outcome: >-
        ContextRanker uses semantic similarity boosting without any opt-in flag.
        When sentence-transformers is unavailable, a stderr warning is emitted
        and ranking proceeds without semantic boost (no silent no-op).
      threshold: >-
        `python3 -c "from ranking.ranker import ContextRanker, _ADAPTIVE_TOPK_ABS_FLOOR;
        r = ContextRanker(); assert r._use_embeddings; assert _ADAPTIVE_TOPK_ABS_FLOOR == 0.40"`
        exits 0.
      negative_case: >-
        When sentence-transformers is not installed, stderr contains
        "semantic model is unavailable" and the pack is still returned with all
        other signals applied.
      verify:
        cmd: >-
          python3 -c "from ranking.ranker import ContextRanker, _ADAPTIVE_TOPK_ABS_FLOOR;
          r = ContextRanker(token_budget=0); assert r._use_embeddings is True;
          assert _ADAPTIVE_TOPK_ABS_FLOOR == 0.40; print('PASS: semantic-rerank-default')"
        expected_stdout_contains: "PASS: semantic-rerank-default"

  - id: v4.4.4-fts-implement-anchor
    phase: v4.4.4
    priority: P0
    description: >-
      FTS5-anchored implement-mode candidate retrieval recovers GT symbols on
      >10K-symbol repos when no diff is available. Closes the candidate-cap
      regression flagged in BENCHMARKS.md.
    dod:
      outcome: >-
        On a >=10K-symbol repo, `pack --mode implement --query "<known-good
        terms>"` returns the GT file in the top-3 selected items even though
        the GT symbol falls outside the get_all 10K slice.
      threshold: >-
        `uv run pytest packages/core/tests/test_implement_fts_anchor.py -q`
        exits 0 with both integration tests passing.
      negative_case: >-
        When FTS returned 0 hits AND get_all returned >=10K rows, stderr
        contains "FTS5 implement-mode anchor returned 0 matches" naming the
        query. Small repos (<10K symbols) emit no warning even on a no-match.
      verify:
        cmd: >-
          uv run pytest packages/core/tests/test_implement_fts_anchor.py
          packages/storage-sqlite/tests/test_symbols_fts.py -q
        expected_stdout_contains: "passed"

  - id: v4.4.4-anchor-flag
    phase: v4.4.4
    priority: P0
    description: >-
      The holdout runner exposes three retrieval-anchor configurations
      (fix-sha / parent-sha-with-diff / query-only) so reviewers can
      distinguish "the input contained the answer" from "retrieval actually
      worked." Anchor is stamped in every score JSON and summary.
    dod:
      outcome: >-
        Every per-task score_*.json and summary.json carries an "anchor"
        field naming the retrieval configuration used. summary.md shows
        the anchor at the top.
      threshold: >-
        `bash benchmark/run-holdout.sh --repo gin=<path> --anchor
        parent-sha-with-diff --output-dir /tmp/cr-anchor-smoke` produces
        a summary.json whose top-level "anchor" key equals
        "parent-sha-with-diff".
      negative_case: >-
        `--anchor bogus` exits non-zero with stderr "must be one of:
        fix-sha | parent-sha-with-diff | query-only" — never silently
        falls back to the default.
      verify:
        cmd: >-
          bash benchmark/run-holdout.sh --repo gin=/tmp/nope --anchor bogus 2>&1 || true
        expected_stdout_contains: "fix-sha | parent-sha-with-diff | query-only"

  - id: v4.4.4-honest-comparison
    phase: v4.4.4
    priority: P1
    description: >-
      Workload-matched comparison vs code-review-graph published. Both
      tools see identical SHAs and identical diffs as input under the
      parent-sha-with-diff anchor.
    dod:
      outcome: >-
        benchmarks/comparison-code-review-graph.md exists, names the
        anchor explicitly, lists the 3 k8s SHAs, and gives a per-task
        side-by-side table covering predicted files, tokens, runtime,
        and rank-1 hit for both tools.
      threshold: >-
        benchmarks/results/2026-04-29-k8s-comparison/summary.json contains
        records for both "context-router" and "code-review-graph" across
        all 3 tasks (6 records total) with no exit_status != 0 entries.
      negative_case: >-
        If code-review-graph errors on a task, the failure mode (exit
        status, stderr tail) is captured in
        comparison_<task_id>.json — never silently skipped.
      verify:
        cmd: >-
          jq '[.by_task | to_entries[] | .value | to_entries[] | .value
          | select(.exit_status == 0)] | length'
          benchmarks/results/2026-04-29-k8s-comparison/summary.json
        expected_stdout_contains: "6"

  - id: v4.4.4-graph-renders
    phase: v4.4.4
    priority: P2
    description: >-
      `context-router graph` opens the page by default and renders end-to-end
      on real repos within 2 seconds at the default 500-node cap.
    dod:
      outcome: >-
        Running `context-router graph` opens a browser tab whose SVG contains
        force-laid-out nodes within ~2s. CI-suppressible via --no-open or
        CR_GRAPH_NO_OPEN=1.
      threshold: >-
        `uv run pytest apps/cli/tests/test_graph_command.py -q` exits 0;
        the rendered HTML for a fixture repo parses and yields >=1 SVG node.
      negative_case: >-
        When the graph would exceed --max-nodes (default 500), stderr
        contains a WARN naming the dropped count and "--max-nodes 0" as
        the opt-out — never silently truncates.
      verify:
        cmd: >-
          uv run pytest apps/cli/tests/test_graph_command.py -q
        expected_stdout_contains: "passed"

  - id: v4.4.5-clean-install
    priority: P0
    description: >-
      `context-router-cli` installs on a clean machine with no workspace
      checkout. Workspace-internal packages ship inside the CLI wheel via
      force-include and most are unpublished, so none may be declared as a
      runtime dependency — doing so makes `uv tool install` / `pipx` / `pip`
      try to resolve an unpublished package from PyPI and fail.
    dod:
      outcome: >-
        Installing the built CLI wheel into a fresh virtualenv resolves every
        dependency from PyPI and `context-router --version` runs.
      threshold: >-
        No `context-router-*` distribution appears in
        apps/cli/pyproject.toml [project].dependencies.
      negative_case: >-
        If any workspace-internal (context-router-*) package is reintroduced
        into the CLI dependency list, the verify command exits non-zero — it
        does not silently pass.
      verify:
        cmd: >-
          uv run python -c "import tomllib,sys;
          d=tomllib.load(open('apps/cli/pyproject.toml','rb'));
          bad=[x for x in d['project']['dependencies'] if x.startswith('context-router-')];
          print('internal deps:', bad); sys.exit(1 if bad else 0)"
        expected_stdout_contains: "internal deps: []"

  - id: v4.5-index-hygiene
    priority: P0
    description: >-
      The indexer must never ingest vendored/ignored code. Defaults cover
      .venv*, venv, env, node_modules, vendor, dist, build, target and
      cache dirs; .gitignore is honoured when present.
    dod:
      outcome: >-
        Indexing a repo containing a `.venv-crg/` and `node_modules/` tree
        produces zero symbols from those trees.
      threshold: >-
        On the context-router repo itself after reindex:
        SELECT count(*) FROM symbols WHERE file_path LIKE '%.venv%' = 0
        and total symbol count drops from ~49,000 to under 10,000.
      negative_case: >-
        An unreadable .gitignore writes "WARN: could not read .gitignore"
        with the OS reason to stderr and indexing proceeds with the
        built-in ignore patterns; exit code stays 0.
      verify:
        cmd: >-
          uv run context-router index --json 2>/dev/null &&
          sqlite3 .context-router/context-router.db
          "SELECT count(*) FROM symbols WHERE file_path LIKE '%.venv%'
           OR file_path LIKE '%node_modules%'"
        expected_stdout_contains: "0"

  - id: v4.5-graph-own-code
    priority: P0
    description: >-
      `context-router graph` must show the user's own code, never a
      vendored-symbol graph, and must not silently no-op the -o flag.
    dod:
      outcome: >-
        On this repo, the rendered graph contains symbols from packages/
        and apps/, and `graph --json -o out.json` writes the file.
      threshold: >-
        graph --json output contains at least one node whose file path
        starts with the project root + "/packages/".
      negative_case: >-
        Running graph against a stale polluted index writes
        "WARN: dropped N symbols from ignored paths — re-run
        'context-router index'" to stderr instead of rendering them.
      verify:
        cmd: >-
          uv run context-router graph --json --no-open | python3 -c
          "import json,sys; d=json.load(sys.stdin);
           print(any('/packages/' in n['file'] for n in d['nodes']))"
        expected_stdout_contains: "True"

  - id: v4.5-e2e-tokens
    priority: P1
    description: >-
      Token-saving claims must be end-to-end (pack + downstream reads),
      judged sufficient by a model, on n>=12 holdout tasks.
    dod:
      outcome: >-
        BENCHMARKS.md headline reports end-to-end downstream tokens with a
        model-judge sufficiency rate, replacing pack-only token counts.
      threshold: >-
        Results JSON covers >= 12 tasks across >= 4 holdout repos and
        every task row has downstream_read_tokens and judge.sufficient.
      negative_case: >-
        When the `claude` CLI is missing, benchmark/judge_packs.py exits 1
        with "ERROR: claude CLI not found — judge step requires it" on
        stderr; it never writes a results file with empty judgements.
      verify:
        cmd: >-
          python3 -c "import json;
          d=json.load(open(sorted(__import__('glob').glob(
          'benchmarks/results/*-v4.5-e2e/summary.json'))[-1]));
          print(d['aggregate']['n_tasks'] >= 12)"
        expected_stdout_contains: "True"

  - id: v4.5-docs-current
    priority: P1
    description: >-
      User-facing docs must state the shipped version and the honest
      benchmark claim.
    dod:
      outcome: >-
        README, roadmap, and .handover docs all reference the current
        release and the workload-matched benchmark framing.
      threshold: >-
        grep finds no "4.4.3" and no standalone "91%" claim in README.md;
        docs/roadmap.md header names v4.5.
      negative_case: >-
        N/A (docs change); reviewer checks the diff against CHANGELOG.
      verify:
        cmd: grep -c "4\.4\.3" README.md || true
        expected_stdout_contains: "0"

  # ── v4.6.0 — Hands-Free Context (Phase A + B) ──────────────────────────
  # Spec: docs/design/v4.6-hands-free-context.md

  - id: v4.6-edge-dedup
    priority: P0
    description: >-
      Graph edges must be unique per (repo, from, to, type); repeated
      occurrences become weight, not duplicate rows.
    dod:
      outcome: >-
        Re-indexing a repo where the same class is defined many times
        produces exactly one edge row per distinct relationship.
      threshold: >-
        After indexing this repo, the duplicate-edge query (GROUP BY repo,
        from_symbol_id, to_symbol_id, edge_type HAVING COUNT(*) > 1)
        returns 0 rows; same on the pydantic fixture.
      negative_case: >-
        A file that calls the same function 10 times still contributes that
        signal: the single edge row carries weight >= 10, and ranking
        consumes weight — collapsing rows must not flatten ranking signal.
      verify:
        cmd: >-
          uv run context-router index --project-root . >/dev/null 2>&1 &&
          sqlite3 .context-router/context-router.db "SELECT count(*) FROM
          (SELECT 1 FROM edges GROUP BY repo, from_symbol_id, to_symbol_id,
          edge_type HAVING COUNT(*) > 1)"
        expected_stdout_contains: "0"

  - id: v4.6-symbol-qualification
    priority: P0
    description: >-
      Same-named symbols defined at different scopes in one file are
      distinct symbols, not one collapsed row.
    dod:
      outcome: >-
        Two classes named Model defined inside two different test functions
        index as two symbols, each with its own edges.
      threshold: >-
        Fixture file with N same-named nested classes yields N symbol rows
        with scope-qualified identities and N extends edges to N (or fewer
        distinct) targets.
      negative_case: >-
        Retrieval by the short name ("Model") still matches all of them —
        recall eval (scripts/eval) does not regress below the v4.5 baseline
        F1 0.613.
      verify:
        cmd: >-
          uv run pytest packages/graph-index/tests -k "qualif" -q
        expected_stdout_contains: "passed"

  - id: v4.6-edge-count-consistency
    priority: P1
    description: >-
      The edge count reported by `index` must equal the rows stored.
    dod:
      outcome: >-
        The summary line printed at the end of `context-router index`
        states the same edge count the database contains.
      threshold: >-
        reported == SELECT count(*) FROM edges WHERE repo = ? on first run
        AND on an immediate re-run (pydantic previously: 24,718 vs 27,915
        vs 24,253).
      negative_case: >-
        An incremental per-file update (watch path) reports a delta that
        keeps reported == stored; a mismatch is a test failure, never a
        silently logged number.
      verify:
        cmd: >-
          uv run pytest packages/graph-index/tests apps/cli/tests
          -k "edge_count" -q
        expected_stdout_contains: "passed"

  - id: v4.6-getall-paging
    priority: P0
    description: >-
      Internal ranking must cover the full symbol set on >10k-symbol
      repos instead of consuming a silently partial 10k slice.
    dod:
      outcome: >-
        Packs on a 15k-symbol repo rank over all symbols; no partial-slice
        warning fires from the internal pipeline.
      threshold: >-
        On a fixture with >10,000 symbols, the candidate-assembly pool size
        equals the total symbol count and stderr contains no get_all cap
        WARN during pack.
      negative_case: >-
        External callers of get_all() at the 10k cap still receive the
        loud WARN naming the cap and suggesting iter_all — the guard is
        narrowed, not removed.
      verify:
        cmd: >-
          uv run pytest packages/storage-sqlite/tests packages/core/tests
          -k "iter_all or getall_paging" -q
        expected_stdout_contains: "passed"

  - id: v4.6-graph-accuracy-audit
    priority: P1
    description: >-
      Edge precision/recall must be measured against hand-verified ground
      truth, before and after the Phase A fixes.
    dod:
      outcome: >-
        A published eval doc reports per-edge-type precision and recall on
        a hand-verified sample, with a baseline and post-fix comparison.
      threshold: >-
        Sample covers >= 30 symbols across >= 2 repos; every edge type
        present in the sample has a P and R number; any type with recall
        < 0.8 post-fix has a named finding (fixed or explicitly deferred).
      negative_case: >-
        N/A (eval doc); reviewer checks the sample is stratified, not
        cherry-picked, and that the baseline was captured pre-A1/A2.
      verify:
        cmd: >-
          grep -c "recall" docs/eval/2026-06-10-v4.6-graph-accuracy.md
        expected_stdout_contains: ""

  - id: v4.6-pack-staleness-selfheal
    priority: P0
    description: >-
      Packs must detect stale indexed files and self-heal inline (small
      deltas) or warn loudly (large deltas) — never silently serve stale.
    dod:
      outcome: >-
        Editing a file and running pack without re-indexing returns the
        fresh symbol at its new line numbers.
      threshold: >-
        With <= 25 stale files, pack stderr contains "re-indexed" and the
        edited symbol's line range matches the file on disk.
      negative_case: >-
        With > 25 stale files, stderr contains "WARN" naming the stale file
        count and suggesting 'context-router index'; with a pre-v4.6 index
        (no fingerprints), stderr names the missing-fingerprint reason and
        behavior matches v4.5.
      verify:
        cmd: >-
          uv run pytest packages/core/tests -k "stalen" -q
        expected_stdout_contains: "passed"

  - id: v4.6-hooks-install
    priority: P1
    description: >-
      One command installs Claude Code hooks for automatic index updates;
      install is idempotent and never clobbers user hooks.
    dod:
      outcome: >-
        After `context-router hooks install`, editing a file in a Claude
        Code session triggers an index update with no manual command.
      threshold: >-
        Running install twice produces a byte-identical
        .claude/settings.json; uninstall removes only context-router
        entries, preserving pre-existing user hooks exactly.
      negative_case: >-
        Running hooks install outside a project root exits non-zero with a
        named reason; a settings.json with existing user hooks is merged,
        never overwritten.
      verify:
        cmd: >-
          uv run pytest apps/cli/tests -k "hooks" -q
        expected_stdout_contains: "passed"
